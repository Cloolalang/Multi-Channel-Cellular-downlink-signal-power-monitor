name: Create release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag and release name (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # workflow_dispatch → input tag; push tag → ref name (e.g. v1.1.0)
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      # Node 24 runtimes (see GitHub deprecation of Node 20 actions)
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dashboard/requirements.txt -r dashboard/requirements-build.txt

      - name: PyInstaller build
        working-directory: dashboard
        run: python -m PyInstaller pyinstaller.spec

      - name: Zip exe and flows.json
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item dashboard/dist/LTE-Downlink-Power-Monitor.exe staging/
          Copy-Item flows.json staging/
          $zip = "lte-downlink-power-monitor-${{ env.RELEASE_TAG }}-windows.zip"
          Compress-Archive -Path staging/* -DestinationPath $zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: lte-downlink-power-monitor-${{ env.RELEASE_TAG }}-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
